name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Fork-owned: lets the suite be run on demand without inventing a commit. Forks also need
  # Actions enabled once from the Actions tab; that gate is not reachable from the API.
  workflow_dispatch:

jobs:
  check:
    # Pinned, not `ubuntu-latest`. The suite now launches a real browser, so the image is
    # part of the contract: `ubuntu-latest` moved from 22.04 to 24.04 under existing
    # workflows once already, and 26.04 is in public preview. A surprise image change would
    # arrive as a browser failure in an unrelated PR.
    runs-on: ubuntu-24.04
    # A wedged browser used to be able to burn the full 6h default. The CDP call deadline
    # makes that unlikely; this makes it impossible.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check
      - run: cargo clippy -- -D warnings
      # The browser tests skip themselves when Chrome is missing, and a skip is a pass.
      # Assert Chrome exists here so that a runner image that drops it fails the build
      # instead of silently turning ~57 of 68 tests into no-ops.
      - name: Require a real browser for the test run
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            echo "::error::No Chrome on this runner. The browser tests would skip themselves and report green."
            exit 1
          fi
          google-chrome --version || chromium --version
          # Ubuntu 23.10+ blocks unprivileged user namespaces through AppArmor, which is
          # what Chrome's sandbox uses. The google-chrome .deb ships a profile that grants
          # it, so the system Chrome we launch is expected to work — this lifts the
          # restriction anyway, because the alternative if it ever does bite is passing
          # --no-sandbox, and weakening the sandbox for every user of the tool to keep CI
          # green is the wrong trade. Failure to set it is not fatal.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Prove the browser actually launches before spending the suite on finding out.
          google-chrome --headless=new --disable-gpu --dump-dom about:blank >/dev/null
      # vendor/extract.js has its own jsdom suite (120+ tests) that nothing used to run —
      # not cargo test, not CI. tests/js_suite_tests.rs runs it now, but only if jsdom is
      # installed; without this step it would skip, and under CHROME_AGENT_REQUIRE_CHROME
      # that skip is fatal. Installing it here is what makes the extraction engine gated.
      # `npm ci`, with no `|| npm install` fallback: the fallback would regenerate the
      # lockfile on the fly and let a drifted package.json pass green, which is the
      # failure this whole pass keeps closing elsewhere. A lockfile that no longer
      # satisfies package.json is a commit somebody forgot to make, not a hiccup.
      - name: Install the extraction suite's dependencies
        run: npm ci --prefix tests/js
      - run: cargo test -- --test-threads=1
        env:
          # Turns every "SKIP: …" into a failure. See tests/common/mod.rs.
          CHROME_AGENT_REQUIRE_CHROME: 1
      # Linux release binaries are fully static musl builds (issue #3). That only works
      # while the dependency graph stays pure Rust — a C-linking crate (TLS/crypto backend)
      # would reintroduce a glibc dependency. Fail fast if one sneaks back in.
      - name: Guard pure-Rust dependency graph
        run: |
          for c in ring openssl-sys aws-lc-sys; do
            if cargo tree -i "$c" >/dev/null 2>&1; then
              echo "::error::Crate '$c' pulls in C code and breaks fully-static musl Linux builds (issue #3). Use a pure-Rust alternative or disable the offending feature."
              exit 1
            fi
          done
          echo "Dependency graph is pure Rust — static musl Linux builds stay portable."

  # FORK. Windows was build-only upstream and had never been exercised: the test suite did
  # not compile for `x86_64-pc-windows-msvc` at all, because two pieces of Unix-only test
  # code were never gated. Either one took the whole test binary down, so `cargo test` had
  # never run on the platform. That is how a `FileLock` whose non-Unix arm was an empty
  # struct returning `Ok(())` survived, under the one feature that advertises isolation.
  #
  # Pinned image for the same reason the Linux job pins one: a surprise image change should
  # not arrive as a browser failure in an unrelated PR.
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo clippy --all-targets -- -D warnings
      # Same rule the Linux job states: a skip is a pass, so a runner image without Chrome
      # would turn the browser tests into green no-ops rather than failing.
      - name: Require a real browser for the test run
        shell: pwsh
        run: |
          $chrome = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) {
            Write-Error "No Chrome on this runner. The browser tests would skip themselves and report green."
            exit 1
          }
          & $chrome --version
      # `--test-threads=1` for the reason the Linux job uses it: the suite drives real
      # browsers and a shared session store.
      #
      # This ran unit-tests-only for a while, because the browser tests hung: Chrome inherited
      # our stdout handle, so a caller reading our output waited for the browser's lifetime
      # instead of the command's, and one test sat for 28 minutes. Fixed in `browser.rs`, and
      # `tests/output_pipe_tests.rs` pins it.
      #
      # `CHROME_AGENT_REQUIRE_CHROME` is on: a skip is a pass, and this platform has already
      # shown how much can hide behind one.
      # The extraction engine's jsdom suite is part of the gate on every platform, not just
      # Linux. Without this it skips, and a skip is a pass.
      - name: Install the extraction suite's dependencies
        run: npm ci --prefix tests/js
      # `--no-fail-fast` because cargo otherwise stops at the first failing test binary, and on
      # a platform still being brought up that turns every CI round into one defect. The whole
      # remaining list in one run is what lets them be fixed as a set.
      - run: cargo test --no-fail-fast -- --test-threads=1
        env:
          CHROME_AGENT_REQUIRE_CHROME: 1

  # FORK. `release.yml` ships five targets and, before today, tests had run on exactly one of
  # them. Windows turned out to be broken outright: every invocation died with
  # STATUS_STACK_OVERFLOW because the main thread's 1 MiB could not hold the dispatch frame.
  # That shipped as a release target for the whole life of the project.
  #
  # macOS is the other half of that gap, on two shipped targets, and `browser.rs` carries
  # macOS-specific discovery paths that nothing has ever executed. Same reasoning as the
  # Windows job: the only way to know is to run it.
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo clippy --all-targets -- -D warnings
      # A skip is a pass, so a runner without a browser would report green. Install rather
      # than assert: unlike the Linux and Windows images, Chrome is not guaranteed here.
      - name: Require a real browser for the test run
        run: |
          APP="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$APP" ]; then
            brew install --cask google-chrome || true
          fi
          if [ ! -x "$APP" ]; then
            echo "::error::No Chrome on this runner. The browser tests would skip themselves and report green."
            exit 1
          fi
          "$APP" --version
      # The extraction engine's jsdom suite is part of the gate on every platform, not just
      # Linux. Without this it skips, and a skip is a pass.
      - name: Install the extraction suite's dependencies
        run: npm ci --prefix tests/js
      # Baseline established over two green runs, so the guarantee goes on here too. It was
      # left off for the first run deliberately, and leaving it off any longer would have kept
      # hiding the jsdom suite skipping for want of the install step above.
      - run: cargo test -- --test-threads=1
        env:
          CHROME_AGENT_REQUIRE_CHROME: 1
